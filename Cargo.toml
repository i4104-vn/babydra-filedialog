[package]
name = "babydra-filedialog"
version = "1.0.0"
edition = "2021"

[dependencies]
babydra-core = { git = "https://github.com/i4104-vn/babydra-core.git", package = "babydra-core", tag = "v1.0.0" }
babydra-ui-kit = { git = "https://github.com/i4104-vn/babydra-core.git", package = "babydra-ui-kit", tag = "v1.0.0" }

gtk4 = { version = "0.9", features = ["v4_10"] }
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process"] }
zbus = { version = "4.0", features = ["blocking"] }
dirs = "5.0"
chrono = "0.4"
url = "2.5"

[patch."https://github.com/i4104-vn/babydra-core.git"]
babydra-core = { path = "../babydra-core/crates/babydra-core" }
babydra-ui-kit = { path = "../babydra-core/crates/babydra-ui-kit" }
